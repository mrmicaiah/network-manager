name = "network-manager"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Disable preview URLs and workers.dev subdomain for Durable Objects compatibility
preview_urls = false
workers_dev = false

# D1 Database — contact graph, users, interactions
[[d1_databases]]
binding = "DB"
database_name = "network-manager-db"
database_id = "c9432a3a-f521-4b41-99f8-b347b3c90bb0"

# R2 for bulk imports, exports, backups
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "network-manager-storage"

# ===========================================================================
# Durable Objects — Conversation State Management
# ===========================================================================

# Post-signup onboarding conversations
[[durable_objects.bindings]]
name = "ONBOARDING_DO"
class_name = "OnboardingDO"

# Pre-signup discovery conversations (unknown numbers)
[[durable_objects.bindings]]
name = "USER_DISCOVERY_DO"
class_name = "UserDiscoveryDO"

# Pending nudge context for follow-up handling
[[durable_objects.bindings]]
name = "NUDGE_CONTEXT_DO"
class_name = "NudgeContextDO"

# Intent sorting session state
[[durable_objects.bindings]]
name = "INTENT_SORTING_DO"
class_name = "IntentSortingDO"

# Free plan requires new_sqlite_classes instead of new_classes
[[migrations]]
tag = "v1"
new_sqlite_classes = ["OnboardingDO", "UserDiscoveryDO", "NudgeContextDO", "IntentSortingDO"]

# ===========================================================================
# Cron Triggers — Scheduled Jobs
# ===========================================================================
#
# Hourly trigger handles timezone-aware delivery.
# Other triggers for batch processing at fixed UTC times.
#
# @see worker/cron/scheduled.ts for job implementations
# ===========================================================================
[triggers]
crons = [
  "0 * * * *",   # Hourly: timezone-aware nudge generation & delivery
  "0 9 * * *",   # 9am UTC: daily trial reminders (fallback for users without timezone)
  "0 10 * * 1",  # Monday 10am UTC: weekly sorting check-in (fallback)
  "0 0 * * *",   # Midnight UTC: trial expiration + usage cleanup
  "0 6 * * 1",   # Monday 6am UTC: weekly health recalculation
]

[vars]
ENVIRONMENT = "production"
SIGNUP_BASE_URL = "https://app.untitledpublishers.com"
MAX_FREE_CONTACTS = "15"
TRIAL_DAYS = "14"
